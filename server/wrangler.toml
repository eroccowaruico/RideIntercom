name = "rideintercom"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
APPLE_AUTH_ENABLED = "false"
APPLE_CLIENT_ID = "com.yowamushi-inc.RideIntercom.RideIntercom"
SERVICE_ENABLED = "false"
TURN_ENABLED = "false"
NOTIFICATIONS_ENABLED = "false"
APNS_TOPIC = ""
APNS_ENVIRONMENT = "sandbox"
MAX_ROOM_PARTICIPANTS = "8"
MAX_ACTIVE_SESSIONS = "32"
MONTHLY_PARTICIPANT_SECONDS = "1000000"
LEASE_SECONDS = "600"

# Approximate per-location abuse limits, not a billing cap. Separate namespaces
# below keep preview traffic out of production counters.
[[ratelimits]]
name = "APPLE_ENROLLMENT_IP_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
[[ratelimits]]
name = "APPLE_ENROLLMENT_GLOBAL_LIMIT"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"
[[durable_objects.bindings]]
name = "USAGE_GUARD"
class_name = "UsageGuard"
[[durable_objects.bindings]]
name = "APPLE_AUTH_ATTEMPT"
class_name = "AppleAuthAttempt"
[[durable_objects.bindings]]
name = "USER_ACCOUNT"
class_name = "UserAccount"

[[durable_objects.bindings]]
name = "NOTIFICATION_INDEX"
class_name = "NotificationIndex"

# Fresh, never-deployed development namespace: SQLite is available on Workers Free.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom", "UsageGuard"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AppleAuthAttempt", "UserAccount"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["NotificationIndex"]


# Previews inherit the SFU values and device registry from Previews Base.
# Ordinary variables and env bindings must be declared separately from production.
[previews.vars]
APPLE_AUTH_ENABLED = "false"
APPLE_CLIENT_ID = "com.yowamushi-inc.RideIntercom.RideIntercom"
SERVICE_ENABLED = "true"
TURN_ENABLED = "false"
NOTIFICATIONS_ENABLED = "false"
APNS_TOPIC = ""
APNS_ENVIRONMENT = "sandbox"
MAX_ROOM_PARTICIPANTS = "8"
MAX_ACTIVE_SESSIONS = "32"
MONTHLY_PARTICIPANT_SECONDS = "1000000"
LEASE_SECONDS = "600"

[[previews.ratelimits]]
name = "APPLE_ENROLLMENT_IP_LIMIT"
namespace_id = "1003"
simple = { limit = 30, period = 60 }
[[previews.ratelimits]]
name = "APPLE_ENROLLMENT_GLOBAL_LIMIT"
namespace_id = "1004"
simple = { limit = 300, period = 60 }

[[previews.durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"
[[previews.durable_objects.bindings]]
name = "USAGE_GUARD"
class_name = "UsageGuard"
[[previews.durable_objects.bindings]]
name = "APPLE_AUTH_ATTEMPT"
class_name = "AppleAuthAttempt"
[[previews.durable_objects.bindings]]
name = "USER_ACCOUNT"
class_name = "UserAccount"

[[previews.durable_objects.bindings]]
name = "NOTIFICATION_INDEX"
class_name = "NotificationIndex"
